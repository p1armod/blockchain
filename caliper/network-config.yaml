name: land-registration-network
version: '2.0.0'
mutual-tls: false

caliper:
  blockchain: fabric

channels:
  - channelName: mychannel
    created: true
    contracts:
      - id: land-registration
        version: '2.0'
        language: node
        path: ../chaincode/land-registration
        metaPath: ../chaincode/land-registration

organizations:
  - mspid: Org1MSP
    identities:
      certificates:
        - name: admin-registration
          clientPrivateKey:
            path: >-
              ../fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/keystore/priv_sk
          clientSignedCert:
            path: >-
              ../fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/signcerts/Admin@org1.example.com-cert.pem
    connectionProfile:
      path: >-
        ../fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/connection-org1.json
      discover: true
